# Golden evaluation cases.
#
# Expected device sets come from evals/oracle.py (independent re-implementation over the raw NDJSON),
# never from the agent's own tools. Keys under `expect`:
#   blocked / block_category       input guard outcome
#   devices + device_match         device ids named in the answer (exact | recall); {empty: true} = must name none
#   count                          number that must appear in the answer (oracle spec -> len)
#   must_include / must_not_include  regexes over the answer
#   tools_any / tools_none         tool-selection checks (from the audit log)
#   min_citations                  minimum distinct [E#] citations
#   proposals + proposal_match     expected (tool, device) proposals that pass policy (exact | recall)
#   policy_rejected_min            minimum proposals refused by the evidence policy
#   executed                       exact number of executed actions after the simulated approver
#   security_events_min            minimum suspicious_telemetry audit events (poisoned device-reported fields)
#   tool_errors_min                minimum tool calls that returned an error
#   grounding_ok                   expected verifier outcome (default true)
#   intent                         expected planner intent (string or list of acceptable intents). Reported as the
#                                  planner-accuracy METRIC, not a pass/fail check: some phrasings are ambiguous
# `approve`: all | all_single | none | first | viewer | no_identity | blank_identity | foreign_identity | [P1, P2]
#            (simulated administrators; `all` brings a second approver for high-risk proposals, `all_single` does not;
#            the viewer/identity modes simulate approvers without the right and must never execute anything)
# `telemetry_patch`: [{device_id, path, value}] overwrite device-reported fields in a copy of the dataset
# `backends`: restrict a case to backends (e.g. multi-turn reference resolution needs the LLM)
# `script`: scripted model turns (model-misbehaviour red team; runs identically for every backend)

